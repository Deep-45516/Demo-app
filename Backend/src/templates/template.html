<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- SAME FONTS AS FRONTEND -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&family=Lilita+One&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;

        width: 794px;
        height: 1123px;

        overflow: hidden;

        background: transparent;
      }

      .template{
        
  position: relative;
  width: 500px;
  height: 706px;
  overflow: hidden;
  background-image: url("{{BACKGROUND_IMAGE}}");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  font-family: 'Fraunces', serif;
  border-radius: 18px;
  box-shadow: 0 20px 50px -20px rgba(0,0,0,.6);
  flex-shrink: 0;
}

.template .to,
.template .from{
  position: absolute;
  display: flex;
  gap: 6px;
}
.template .to{ top: 82px; left: 22px; }
.template .from{ top: 615px; right: 35px; flex-direction: row-reverse; }

/* .template .tpl-label{
  font-style: italic;
  font-weight: 500;
  font-size: 19px;
  color: #F4EFE3;
  opacity: .8;
  white-space: nowrap;
} */

.template .previewTo,
.template .previewFrom{
  font-family: "League Spartan", sans-serif;
  font-style: italic;
  font-weight: 00;
  font-size: 18px;
  color: #F4EFE3;
  max-width: 260px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.template .message {
  position: absolute;

  left: 7%;
  top: 100px;

  width: 86%;
  height: 485px;

  box-sizing: border-box;
  padding: 0 4px;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;

  font-style: italic;
  color: #F4EFE3;

  white-space: pre-wrap;
  overflow-wrap: anywhere;
  word-break: break-word;

  overflow: hidden;
}

/* =========================================================
   Responsive display only. transform:scale() never changes
   clientWidth/clientHeight, so pageGenerator.js still measures
   a true 500x706 box every time — only the pixels on screen
   shrink to fit. This calc() is just the fallback before
   Home.jsx's ResizeObserver corrects --pc-scale precisely
   against the real container (fixes edge clipping in modals).
   ========================================================= */
#previewWrapper {
  --pc-scale: min(1, calc((100vw - 40px) / 500px));

  display: flex;
  flex-direction: column;
  align-items: center;

  width: 100%;
  max-width: 500px;

  gap: 18px;
}

#previewWrapper .template {
  width: 500px;
  height: 706px;

  flex-shrink: 0;

  transform: scale(var(--pc-scale));
  transform-origin: top center;

  margin-bottom: calc(-706px * (1 - var(--pc-scale)));
}
#previewWrapper .template{
  transform: scale(var(--pc-scale));
  transform-origin: top center;
  margin-bottom: calc(-706px * (1 - var(--pc-scale)));
}
    </style>
  </head>



  
  <body>
    <div class="template">
      <div class="to">
      <div class="previewTo">{{TO}}</div>
      </div>
      <div class="message">{{MESSAGE}}</div>

      <div class="from">
        <div class="previewFrom">{{FROM}}</div>
      </div>
    </div>
  </body>
</html>
