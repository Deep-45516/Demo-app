<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- SAME FONTS AS FRONTEND -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&family=Lilita+One&display=swap" rel="stylesheet">

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      padding:0;

      width:794px;
      height:1123px;

      overflow:hidden;

      background:transparent;
    }

    .template{
      width:794px;
      height:1123px;

      position:relative;

      background-image:url("{{BACKGROUND_IMAGE}}");

      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;

      overflow:hidden;
    }

    .previewTo{
      font-family:'Lilita One', cursive;

      position:absolute;

      top:11%;
      left:14.3%;

      margin:0;

      font-size:19px;

      opacity:0.85;

      letter-spacing:1px;
    }

    .message{
  position:absolute;
      font-weight:400;
  top:17%;
  left:16%;

  width:70%;
  height:69%;

  font-family:'League Spartan', sans-serif;

  text-align:center;

  overflow:hidden;

  white-space:pre-wrap;
  word-break:break-word;

  line-height:1.8;

  font-size:42px;

  display:block;
  box-sizing:border-box;
}.message {
  position:absolute;
  font-weight:400;

  top:17%;
  left:16%;

  width:70%;
  height:83%;

  font-family:'League Spartan', sans-serif;

  text-align:center;
  overflow:hidden;

  white-space:pre-wrap;
  word-break:break-word;

  line-height:1.8;
  font-size:42px;

  display:flex;
  align-items:center;
  justify-content:center;

  box-sizing:border-box;
}

    .previewFrom{
      font-family:'Lilita One', cursive;

      opacity:0.85;

      margin:0;

      text-align:center;

      white-space:pre-line;
      word-break:break-word;

      line-height:1;

      letter-spacing:1px;

      font-size:22px;
    }

    .from{
      position:absolute;

      top:91%;
      left:77.5%;

      transform:translateX(-50%);

      width:260px;
    }

  </style>
</head>

<body>

  <div class="template">

    <div class="previewTo">
      {{TO}}
    </div>

    <div class="message">
      {{MESSAGE}}
    </div>

    <div class="from">
      <div class="previewFrom">
        {{FROM}}
      </div>
    </div>

  </div>

</body>
</html>
